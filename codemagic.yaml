workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Egg Runner Adventure Codemagic

    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.eggrunneradventure.eggrunneradventuregame
        APP_STORE_APPLE_ID: "6789471673"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part
          include: true

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          keychain initialize
          # Create a distribution certificate if none exists, then the profile.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create \
            --verbose
          keychain add-certificates
          echo "=== Provisioning profiles on disk ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" 2>/dev/null || true
          # Compile Dart/Flutter unsigned first — this can rewrite the
          # Xcode project, so apply provisioning profiles AFTER it.
          flutter build ios --release --no-codesign
          xcode-project use-profiles --code-signing-setup-verbose-logging
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
