workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Egg Runner Adventure Codemagic

    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.eggrunneradventure.eggrunneradventuregame
        APP_STORE_APPLE_ID: "6789471673"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part
          include: true

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          flutter build ipa --release \
            --export-options-plist=$CM_EXPORT_OPTIONS_PLIST

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
