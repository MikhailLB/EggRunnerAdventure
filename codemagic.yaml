workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eggrunneradventure.eggrunneradventuregame
      vars:
        APP_STORE_APPLE_ID: "6789471673"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part
          include: true

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
        working_directory: ios

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
